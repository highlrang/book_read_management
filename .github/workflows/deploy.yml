name: Build and Push to ECR

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Variable Substitution
        uses: microsoft/variable-substitution@v1
        with:
          files: './src/main/resources/application.yml'
        env:
          spring.datasource.username: ${{ secrets.DB_USERNAME }}
          spring.datasource.password: ${{ secrets.DB_PASSWORD }}
          spring.mail.password: ${{ secrets.MAIL_PASSWORD }}
          spring.data.redis.password: ${{ secrets.REDIS_PASSWORD }}
          google.ai.api-key: ${{ secrets.GEMINI_API_KEY }}
          client.aladin.ttbKey: ${{ secrets.ALADIN_KEY }}
          client.naver.clientId: ${{ secrets.NAVER_SEARCH_CLIENT_ID }}
          client.naver.clientSecret: ${{ secrets.NAVER_SEARCH_CLIENT_SECRET }}
          apiKey: ${{ secrets.API_KEY }}
          secretKey: ${{ secrets.SECRET_KEY }}
          auth.encryption.key-id: ${{ secrets.AUTH_ENCRYPTION_KEY_ID || 'primary' }}
          auth.encryption.algorithm: ${{ secrets.AUTH_ENCRYPTION_ALGORITHM || 'RSA/ECB/OAEPWithSHA-256AndMGF1Padding' }}
          auth.encryption.public-key: ${{ secrets.AUTH_ENCRYPTION_PUBLIC_KEY }}
          auth.encryption.private-key: ${{ secrets.AUTH_ENCRYPTION_PRIVATE_KEY }}
          auth.encryption.allow-plain-password: ${{ secrets.AUTH_ENCRYPTION_ALLOW_PLAIN_PASSWORD || 'true' }}


      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "Building local image: book-read-management-api:${IMAGE_TAG}"
          docker build -t book-read-management-api:${IMAGE_TAG} .
          
          echo "Tagging for Docker Hub..."
          docker tag book-read-management-api:${IMAGE_TAG} \
            docker.io/${{ secrets.DOCKER_USERNAME }}/book-read-management-api:${IMAGE_TAG}
          docker tag book-read-management-api:${GITHUB_SHA} \
            docker.io/${{ secrets.DOCKER_USERNAME }}/book-read-management-api:latest

      - name: Push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/book-read-management-api:${IMAGE_TAG}
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/book-read-management-api:latest

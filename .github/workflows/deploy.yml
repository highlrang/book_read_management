name: Build and Push to ECR

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "MYNAME=${{ secrets.MYNAME }}" >> .env
          echo "ALADIN_KEY=${{ secrets.ALADIN_KEY }}" >> .env
          echo "API_KEY=${{ secrets.API_KEY }}" >> .env

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "Building local image: book-read-management-api:${IMAGE_TAG}"
          docker build -t book-read-management-api:${IMAGE_TAG} .
          
          echo "Tagging for Docker Hub..."
          docker tag book-read-management-api:${IMAGE_TAG} \
            docker.io/${{ secrets.DOCKER_USERNAME }}/book-read-management-api:${IMAGE_TAG}
          docker tag book-read-management-api:${GITHUB_SHA} \
            docker.io/${{ secrets.DOCKER_USERNAME }}/book-read-management-api:latest

      - name: Push Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/book-read-management-api:${IMAGE_TAG}
          docker push docker.io/${{ secrets.DOCKER_USERNAME }}/book-read-management-api:latest
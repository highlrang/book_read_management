<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 인증 완료</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f9;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 64px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .close-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4A90E2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">✅</div>
    <h1>이메일 인증 완료!</h1>
    <p>
        성공적으로 인증되었습니다.<br>
        <strong>이제 원래 가입 페이지(탭)로 돌아가서</strong><br>
        회원가입을 계속 진행해 주세요.
    </p>
    <button class="close-btn" onclick="window.close()">이 창 닫기</button>
</div>

<script>
    // 모바일 메일 앱 등에서 window.close()가 작동하지 않을 수 있으므로
    // 5초 후 자동으로 창을 닫거나 안내 메시지를 유지합니다.
    setTimeout(function() {
        // 일부 브라우저에서는 스크립트로 열린 창만 닫을 수 있습니다.
    }, 5000);
</script>
</body>
</html>

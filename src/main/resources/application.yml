
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      naming:
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  mail:
    host: smtp.gmail.com
    port: 587
    username: developoffi@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      password: ${REDIS_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

google:
  ai:
    api-key: ${GEMINI_API_KEY}

recommendation:
  llm:
    planner-model: gemini-2.5-flash-lite
    explainer-model: gemini-2.5-flash

client:
  aladin:
    ttbKey: ${ALADIN_KEY}
  naver:
    clientId: ${NAVER_SEARCH_CLIENT_ID:}
    clientSecret: ${NAVER_SEARCH_CLIENT_SECRET:}

apiKey: ${API_KEY}

secretKey: ${SECRET_KEY}

fcm:
  server-key: ${FCM_SERVER_KEY:}

auth:
  social:
    google-client-id: ${GOOGLE_SERVER_CLIENT_ID:}
  encryption:
    key-id: ${AUTH_ENCRYPTION_KEY_ID:primary}
    algorithm: ${AUTH_ENCRYPTION_ALGORITHM:RSA/ECB/OAEPWithSHA-256AndMGF1Padding}
    public-key: ${AUTH_ENCRYPTION_PUBLIC_KEY:}
    private-key: ${AUTH_ENCRYPTION_PRIVATE_KEY:}
    allow-plain-password: ${AUTH_ENCRYPTION_ALLOW_PLAIN_PASSWORD:true}
  email-verification:
    link-base-url: ${AUTH_EMAIL_VERIFICATION_LINK_BASE_URL:readingorganizer://verify}
    ttl-seconds: ${AUTH_EMAIL_VERIFICATION_TTL_SECONDS:600}

security:
  sensitive-data:
    secret: ${SENSITIVE_DATA_SECRET:${SECRET_KEY:}}
  token-hash:
    secret: ${TOKEN_HASH_SECRET:${SECRET_KEY:}}
